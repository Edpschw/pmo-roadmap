<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Roadmap PMO</title>
<link rel="stylesheet" href="style.css?v=114" />
</head>
<body>

<header class="toolbar">
  <div class="toolbar-left">
    <h1>Roadmap de Projetos</h1>
    <span class="subtitle" id="rangeLabel"></span>
  </div>
  <div class="toolbar-right">
    <div class="scale-switch" id="scaleSwitch">
      <button data-scale="day" class="scale-btn">Dia</button>
      <button data-scale="month" class="scale-btn">Mês</button>
      <button data-scale="quarter" class="scale-btn">Trimestre</button>
      <button data-scale="year" class="scale-btn">Ano</button>
      <button data-scale="all" class="scale-btn active">Tudo</button>
    </div>
    <button class="btn-ghost" id="todayBtn">Hoje</button>
    <button class="btn-ghost" id="collapseAllBtn">Recolher tudo</button>
    <button class="btn-ghost" id="expandAllBtn">Expandir tudo</button>
    <a class="btn-ghost" href="tabela.html">Ver como tabela</a>
    <a class="btn-ghost" href="mapa.html">Ver mapa</a>
    <a class="btn-ghost" href="analises.html">Ver análises</a>
    <div class="options-wrap">
      <button class="btn-ghost btn-options" id="optionsBtn" title="Mais opções" aria-haspopup="true" aria-expanded="false">⋯</button>
      <div class="options-menu" id="optionsMenu" hidden>
        <button class="options-item" id="importBtn">Importar JSON</button>
        <button class="options-item" id="importExcelBtn">Importar Excel</button>
        <button class="options-item" id="templateExcelBtn">Modelo Excel</button>
        <button class="options-item" id="exportBtn">Exportar</button>
      </div>
    </div>
    <input type="file" id="importFile" accept="application/json" hidden />
    <input type="file" id="importExcelFile" accept=".xlsx,.xls" hidden />
  </div>
</header>

<main class="roadmap-wrapper">
  <div class="roadmap-scroll" id="scrollContainer">
    <div class="roadmap-grid" id="grid"></div>
  </div>
  <div class="empty-state" id="emptyState" hidden>
    <p>Nenhum projeto ainda.</p>
  </div>
</main>

<div class="modal-overlay" id="modalOverlay" hidden>
  <div class="modal" id="modal"></div>
</div>

<div class="popover" id="popover" hidden></div>

<div class="toast" id="toast" hidden></div>

<script src="vendor/xlsx.full.min.js"></script>
<script src="shared.js?v=18"></script>
<script src="app.js?v=36"></script>
</body>
</html>
